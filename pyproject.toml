[project]
name = "pycourse26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "neelelb", email = "neele.lb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fire>=0.7.1",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
]
[project.scripts]
preprocess-pipeline = "pycourse26.preprocessing:pipeline"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
]
